name: Go

on:
  push:
    paths:
      - "packages/go/**"
      - ".github/workflows/go.yml"
  pull_request:
    paths:
      - "packages/go/**"
      - ".github/workflows/go.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
